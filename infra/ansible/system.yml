- name: Deploy Learn Kannada application
  hosts: myhosts
  become: yes
  vars:
    app_dir: /opt/learn-kannada
    repository_url: https://github.com/baramsivaramireddy/learn_kannada.git
    app_user: learnkannada

  tasks:
    - name: Install operating-system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - nginx
        state: present
        update_cache: yes

    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/setup_22.x
        dest: /tmp/nodesource-setup.sh
        mode: '0755'

    - name: Configure NodeSource repository
      ansible.builtin.command: /tmp/nodesource-setup.sh
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Create deployment swap file
      ansible.builtin.shell: |
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
      args:
        creates: /swapfile

    - name: Enable deployment swap file
      ansible.builtin.shell: |
        grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
        swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile
      changed_when: false

    - name: Create application user
      ansible.builtin.user:
        name: '{{ app_user }}'
        system: yes
        create_home: yes
        shell: /usr/sbin/nologin

    - name: Create application directory
      ansible.builtin.file:
        path: '{{ app_dir }}'
        state: directory
        owner: '{{ app_user }}'
        group: '{{ app_user }}'
        mode: '0755'

    - name: Check for an existing Git checkout
      ansible.builtin.stat:
        path: '{{ app_dir }}/.git'
      register: application_git

    - name: Remove incomplete application directory
      ansible.builtin.file:
        path: '{{ app_dir }}'
        state: absent
      when: not application_git.stat.exists

    - name: Recreate application directory
      ansible.builtin.file:
        path: '{{ app_dir }}'
        state: directory
        owner: '{{ app_user }}'
        group: '{{ app_user }}'
        mode: '0755'
      when: not application_git.stat.exists

    - name: Repair application Git remote
      ansible.builtin.shell: |
        git -c safe.directory='{{ app_dir }}' remote remove origin 2>/dev/null || true
        git -c safe.directory='{{ app_dir }}' remote add origin '{{ repository_url }}'
      args:
        chdir: '{{ app_dir }}'
      when: application_git.stat.exists

    - name: Pull latest application repository changes
      ansible.builtin.command:
        cmd: git -c safe.directory='{{ app_dir }}' pull --ff-only origin main
      args:
        chdir: '{{ app_dir }}'
      when: application_git.stat.exists

    - name: Clone application repository
      ansible.builtin.command:
        cmd: git clone --branch main '{{ repository_url }}' '{{ app_dir }}'
      when: not application_git.stat.exists

    - name: Copy backend environment file
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backend/.env'
        dest: '{{ app_dir }}/backend/.env'
        owner: '{{ app_user }}'
        group: '{{ app_user }}'
        mode: '0600'

    - name: Install backend dependencies
      ansible.builtin.command: npm ci --include=dev --no-audit --no-fund
      args:
        chdir: '{{ app_dir }}/backend'

    - name: Generate Prisma client
      ansible.builtin.command: npm run prisma:generate
      args:
        chdir: '{{ app_dir }}/backend'

    - name: Install frontend dependencies
      ansible.builtin.command: npm ci --no-audit --no-fund
      args:
        chdir: '{{ app_dir }}/frontend'

    - name: Build frontend
      ansible.builtin.command: npm run build
      args:
        chdir: '{{ app_dir }}/frontend'
      environment:
        NODE_OPTIONS: --max-old-space-size=768

    - name: Set application ownership
      ansible.builtin.file:
        path: '{{ app_dir }}'
        owner: '{{ app_user }}'
        group: '{{ app_user }}'
        recurse: yes

    - name: Install backend systemd unit
      ansible.builtin.template:
        src: learn-kannada-backend.service
        dest: /etc/systemd/system/learn-kannada-backend.service
        mode: '0644'

    - name: Configure Nginx reverse proxy
      ansible.builtin.template:
        src: learn-kannada.nginx
        dest: /etc/nginx/sites-available/learn-kannada
        mode: '0644'
      notify: Reload Nginx

    - name: Enable Learn Kannada Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/learn-kannada
        dest: /etc/nginx/sites-enabled/learn-kannada
        state: link
      notify: Reload Nginx

    - name: Disable the default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and restart backend service
      ansible.builtin.systemd:
        name: learn-kannada-backend
        daemon_reload: yes
        enabled: yes
        state: restarted

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: Wait for local Nginx response
      ansible.builtin.uri:
        url: http://127.0.0.1
        method: GET
        headers:
          Host: dev.learnkannada.co.in
        follow_redirects: none
        status_code: [200, 301, 302, 307, 308]
      register: website
      until: website.status in [200, 301, 302, 307, 308]
      retries: 10
      delay: 3

    - name: Install Certbot and Nginx plugin
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Obtain Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >
          certbot --nginx
          -d dev.learnkannada.co.in
          --non-interactive
          --agree-tos
          -m baramsivarami@gmail.com
          --redirect
      args:
        creates: /etc/letsencrypt/live/dev.learnkannada.co.in/fullchain.pem

    - name: Verify HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1
        method: GET
        headers:
          Host: dev.learnkannada.co.in
        status_code: 200
        validate_certs: no

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded